spring.application.name=airbnb-backend

# 1. Database Connection Link (Change 'airbnb_db' to your local database name)
spring.datasource.url=jdbc:postgresql://localhost:5432/airbnb_db

# 2. Your Local Database Credentials
spring.datasource.username=postgres
spring.datasource.password=admin

# 3. Driver Class Name
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
