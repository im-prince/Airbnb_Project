spring.application.name=airbnb-backend

# 1. Database Connection Link (Change 'airbnb_db' to your local database name)
spring.datasource.url=jdbc:postgresql://localhost:5432/airbnb_db

# 2. Your Local Database Credentials
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 3. Driver Class Name
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.secretKey=${JWT_SECRET_KEY}

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

spring.profiles.active=dev
